<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>CoreChat - WebRTC Chatroom</title>
  <link rel="icon" type="image/svg+xml" href="coreChat.svg">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0" />
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/DerrickRichard/CensorCore-Library@latest/CensorCore.js"></script>
  
  <style>
    :root {
      --bg: #0f172a;
      --card: #020617;
      --accent: #4f46e5;
      --border: #1f2937;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --success: #22c55e;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      height: 100dvh;
      font-family: system-ui, -apple-system, sans-serif;
      background: #020617;
      color: var(--text);
      overflow: hidden;
    }

    /* Links Styling */
    a { color: var(--accent); text-decoration: none; font-weight: 600; transition: 0.2s; }
    a:hover { color: #6366f1; text-decoration: underline; }
    
    .app { display: grid; grid-template-columns: 320px 1fr; height: 100%; width: 100%; }

    .sidebar {
      background: #0f172a;
      border-right: 1px solid var(--border);
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      z-index: 100;
      transition: transform 0.3s ease;
    }

    .sidebar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    #close-sidebar {
      display: none;
      background: none;
      border: none;
      color: var(--muted);
      font-size: 28px;
      cursor: pointer;
      line-height: 1;
    }

    .chat-area { 
      display: flex; 
      flex-direction: column; 
      background: #020617; 
      height: 100dvh; 
      position: relative;
    }

    .header { 
      padding: 12px 20px; 
      border-bottom: 1px solid var(--border); 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      min-height: 60px; 
    }
    
    .messages { 
      flex: 1; 
      padding: 20px; 
      overflow-y: auto; 
      display: flex; 
      flex-direction: column; 
      gap: 12px; 
      scroll-behavior: smooth; 
    }

    .input-area { 
      padding: 16px; 
      border-top: 1px solid var(--border); 
      display: flex; 
      gap: 10px; 
      background: #020617; 
      align-items: center;
    }
    
    .id-box { 
      background: #1e293b; 
      padding: 12px; 
      border-radius: 12px; 
      border: 1px solid var(--accent); 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
    }

    .id-text { font-family: monospace; color: var(--accent); font-weight: 800; font-size: 1.1em; }
    
    input { 
      background: #1e293b; 
      border: 1px solid var(--border); 
      color: white; 
      padding: 12px; 
      border-radius: 10px; 
      outline: none; 
      width: 100%; 
      font-size: 16px;
    }

    .btn { 
      background: var(--accent); 
      color: white; 
      border: none; 
      padding: 12px; 
      border-radius: 10px; 
      cursor: pointer; 
      font-weight: 600; 
    }

    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .msg-wrapper { display: flex; align-items: flex-end; gap: 8px; max-width: 85%; margin-bottom: 4px; }
    .msg-wrapper.me { align-self: flex-end; flex-direction: row-reverse; }
    .msg-wrapper.peer { align-self: flex-start; }
    
    .msg { padding: 10px 16px; border-radius: 18px; font-size: 14px; line-height: 1.4; word-wrap: break-word; transition: all 0.3s; position: relative; }
    .me .msg { background: var(--accent); border-bottom-right-radius: 2px; }
    .peer .msg { background: #334155; border-bottom-left-radius: 2px; }
    
    .msg.blocked { font-style: italic; opacity: 0.6; background: #1e293b !important; color: var(--muted); border: 1px dashed var(--border); }

    .report-btn { background: none; border: none; color: #475569; cursor: pointer; padding: 4px; opacity: 0; font-size: 14px; transition: 0.2s; }
    .msg-wrapper:hover .report-btn { opacity: 1; }
    .report-btn:hover { color: var(--danger); }

    .system-msg { font-size: 11px; color: var(--muted); text-align: center; margin: 12px 0; font-style: italic; }

    .status { font-size: 11px; display: flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 20px; border: 1px solid var(--border); }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: #64748b; }
    .online .dot { background: var(--success); box-shadow: 0 0 8px var(--success); }

    /* Additional UI Styles */
    .msg-time { font-size: 9px; opacity: 0.5; display: block; margin-top: 4px; text-align: right; }
    .read-receipt { font-size: 10px; color: var(--success); margin-left: 4px; display: none; }
    .me .read-receipt { display: inline; opacity: 0.6; }

    #typing-indicator { font-size: 11px; color: var(--muted); font-style: italic; height: 18px; padding-left: 20px; }
    
    #history-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.98);
      color: #00ff41; font-family: 'Courier New', Courier, monospace; padding: 30px;
      display: none; flex-direction: column; z-index: 5000; overflow-y: auto;
    }

    .file-preview { max-width: 250px; max-height: 200px; border-radius: 12px; margin-top: 8px; display: block; cursor: pointer; border: 1px solid var(--border); }
    .file-link { color: white; display: flex; align-items: center; gap: 8px; text-decoration: underline; font-size: 13px; margin-top: 5px; }

    #override-modal {
      position: fixed; inset: 0; background: rgba(2, 6, 23, 0.95);
      display: none; align-items: center; justify-content: center; z-index: 1000;
    }
    .modal-content {
      background: #0f172a; padding: 40px; border-radius: 24px; border: 1px solid var(--accent);
      width: 90%; max-width: 400px; text-align: center;
    }

    @media (max-width: 768px) {
      .app { grid-template-columns: 1fr; }
      .sidebar { position: fixed; inset: 0 auto 0 0; width: 280px; transform: translateX(-100%); }
      .sidebar.open { transform: translateX(0); box-shadow: 10px 0 30px rgba(0,0,0,0.5); }
      #close-sidebar { display: block; }
      .report-btn { opacity: 0.6; }
    }
  </style>
</head>
<body>

<div id="history-overlay">
    <div style="display:flex; justify-content: space-between; border-bottom: 1px solid #00ff41; padding-bottom:10px; margin-bottom:20px;">
        <h2 style="margin:0;">[SECURE_AUDIT_LOG_v4.5]</h2>
        <span>Press CTRL+ALT+Q to Close</span>
    </div>
    <div id="history-content" style="font-size: 13px; line-height: 1.6;"></div>
</div>

<div id="override-modal">
  <div class="modal-content">
    <h2 style="color: var(--accent); margin-top:0;">Access Protocol</h2>
    <p style="font-size: 13px; color: var(--muted); line-height: 1.5;">Administrative Authorization Required.<br>Please enter your Developer Key.</p>
    <input type="password" id="override-pass" style="margin: 24px 0; text-align:center; letter-spacing: 4px;" placeholder="••••••••">
    <div style="display:flex; gap:12px;">
      <button id="cancel-override" class="btn" style="background:#334155; flex:1;">Cancel</button>
      <button id="submit-override" class="btn" style="flex:1;">Authorize</button>
    </div>
  </div>
</div>

<div class="app">
  <aside id="sidebar" class="sidebar">
    <div class="sidebar-header">
      <h3 style="margin:0; font-size: 12px; color: var(--muted); text-transform: uppercase;">Your Profile</h3>
      <button id="close-sidebar">&times;</button>
    </div>
    <div>
      <input type="text" id="name-input" placeholder="Your Name">
      <div class="id-box" style="margin-top:10px">
        <span id="my-id" class="id-text">...</span>
        <button id="copy-btn" style="background:transparent; border:none; color:var(--accent); cursor:pointer; font-size:10px; font-weight:bold;">COPY</button>
      </div>
    </div>
    <div style="margin-top: 20px;">
      <h3 style="margin:0 0 10px; font-size: 12px; color: var(--muted); text-transform: uppercase;">Connect</h3>
      <input type="text" id="peer-id-input" placeholder="Friend's Code" maxlength="6" style="text-transform: uppercase;">
      <button id="connect-btn" class="btn" style="width:100%; margin-top:10px;">Connect</button>
      <button id="end-chat-btn" class="btn" style="width:100%; margin-top:10px; background: var(--danger);" disabled>End Chat</button>
      <button id="download-btn" class="btn" style="width:100%; margin-top:10px; background: #334155;">Download Transcript</button>
    </div>
    <div style="margin-top: auto; font-size: 11px; color: var(--muted); text-align: center;">
      Moderated by <a href="https://derrickrichard.github.io/CensorCore-Library/" target="_blank" rel="noopener noreferrer">CensorCore</a>
    </div>
  </aside>

  <main class="chat-area" id="chat-main">
    <div class="header">
      <button id="menu-btn" style="background:none; border:none; color:white; cursor:pointer; font-size: 20px;">☰</button>
      <div id="chat-title" style="font-weight:700">P2P Chat</div>
      <div id="status-pill" class="status"><div class="dot"></div> <span id="status-text">Connecting...</span></div>
    </div>
    <div id="messages" class="messages"></div>
    <div id="typing-indicator"></div>
    <div class="input-area">
      <input type="file" id="file-input" style="display:none">
      <button id="attach-btn" class="btn" style="background:#334155; padding: 12px 15px;">📎</button>
      <input type="text" id="msg-input" placeholder="Type message..." disabled>
      <button id="send-btn" class="btn" disabled>Send</button>
    </div>
  </main>
</div>

<script>
  const msgInput = document.getElementById('msg-input');
  const sendBtn = document.getElementById('send-btn');
  const messagesEl = document.getElementById('messages');
  const statusText = document.getElementById('status-text');
  const statusPill = document.getElementById('status-pill');
  const chatTitle = document.getElementById('chat-title');
  const nameInput = document.getElementById('name-input');
  const myIdEl = document.getElementById('my-id');
  const sidebar = document.getElementById('sidebar');
  const endChatBtn = document.getElementById('end-chat-btn');
  const historyContent = document.getElementById('history-content');
  const typingEl = document.getElementById('typing-indicator');
  const fileInput = document.getElementById('file-input');
  const attachBtn = document.getElementById('attach-btn');

  let bannedWords = [];
  let conn = null;
  let flagCount = 0;
  let banUntil = null;
  let myIp = "Scanning...";
  let peerIp = "Unknown";
  
  // Anti-Spam Tracking
  let messageHistory = [];

  // ACTION HISTORY LOGIC (SYCED & PERSISTENT)
  function auditLog(action, remoteActor = null) {
    const time = new Date().toLocaleString();
    const actorName = remoteActor ? remoteActor : (nameInput.value || "Unknown");
    const entryText = `[${time}] ${actorName}: ${action}`;
    
    // 1. Create UI Entry
    const div = document.createElement('div');
    div.textContent = entryText;
    historyContent.appendChild(div);
    historyContent.scrollTop = historyContent.scrollHeight;

    // 2. Save to Persistence (Impossible to delete unless browser wiped)
    const existing = localStorage.getItem('corechat_audit_v4') || "";
    localStorage.setItem('corechat_audit_v4', existing + entryText + "\n");

    // 3. Sync to Peer if it's a local action
    if (!remoteActor && conn && conn.open) {
      conn.send({ type: 'audit-sync', action: action });
    }
  }

  // Load existing persistent log
  const savedLog = localStorage.getItem('corechat_audit_v4');
  if (savedLog) {
    savedLog.split('\n').forEach(line => {
      if (!line.trim()) return;
      const div = document.createElement('div');
      div.textContent = line;
      historyContent.appendChild(div);
    });
  }

  // IP Fetching
  fetch('https://api.ipify.org?format=json')
    .then(r => r.json()).then(data => { 
      myIp = data.ip; 
      auditLog(`Local Session Start | IP: ${myIp}`); 
    });

  async function loadWordlist() {
    try {
      const response = await fetch('https://cdn.jsdelivr.net/gh/DerrickRichard/CensorCore-Library@latest/wordlist.json');
      const data = await response.json();
      bannedWords = Object.values(data).flat();
    } catch (e) { console.warn("Library wordlist unavailable."); }
  }
  loadWordlist();

  function getSimilarity(s1, s2) {
    s1 = s1.toLowerCase(); s2 = s2.toLowerCase();
    const costs = [];
    for (let i = 0; i <= s1.length; i++) {
      let lastValue = i;
      for (let j = 0; j <= s2.length; j++) {
        if (i == 0) costs[j] = j;
        else if (j > 0) {
          let newValue = costs[j - 1];
          if (s1.charAt(i - 1) != s2.charAt(j - 1))
            newValue = Math.min(Math.min(newValue, lastValue), costs[j]) + 1;
          costs[j - 1] = lastValue;
          lastValue = newValue;
        }
      }
      if (i > 0) costs[s2.length] = lastValue;
    }
    return costs[s2.length];
  }

  // Normalization Step (Leet-speak)
  function normalizeText(text) {
    if (typeof text !== 'string') return "";
    return text.toLowerCase()
      .replace(/4/g, 'a').replace(/3/g, 'e').replace(/1/g, 'i')
      .replace(/0/g, 'o').replace(/7/g, 't').replace(/5/g, 's')
      .replace(/[^a-z\s]/g, '');
  }

  function checkFuzzy(text) {
    if (typeof text !== 'string') return false;
    const normalized = normalizeText(text); 
    const words = normalized.split(/\s+/);
    for (const word of words) {
      if (word.length < 3) continue;
      for (const banned of bannedWords) {
        const threshold = banned.length > 5 ? 2 : 1;
        if (getSimilarity(word, banned) <= threshold) return true;
      }
    }
    return false;
  }

  const myUniqueId = Math.random().toString(36).substring(2, 8).toUpperCase();
  myIdEl.textContent = myUniqueId;
  nameInput.value = localStorage.getItem('chat-display-name') || "User_" + myUniqueId.slice(0,3);
  
  nameInput.addEventListener('input', () => {
    const oldName = localStorage.getItem('chat-display-name');
    localStorage.setItem('chat-display-name', nameInput.value);
    auditLog(`Updated name from "${oldName}" to "${nameInput.value}"`);
    if (conn && conn.open) {
      conn.send({ type: 'name-update', name: nameInput.value });
    }
  });

  // Peer Initialization with STUN (School Firewall Bypass)
  const peer = new Peer(myUniqueId, {
    config: {
      'iceServers': [
        { url: 'stun:stun.l.google.com:19302' },
        { url: 'stun:global.stun.twilio.com:3478' }
      ]
    }
  });

  function log(msg, isError = false) {
    const div = document.createElement('div');
    div.className = 'system-msg';
    if(isError) div.style.color = 'var(--danger)';
    div.innerHTML = `[System] ${msg}`;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    auditLog(`SYSTEM: ${msg}`);
  }

  function checkBanStatus() {
    if (banUntil && Date.now() < banUntil) {
      const remaining = Math.ceil((banUntil - Date.now()) / 60000);
      log(`Restriction Active: Your messaging privileges are suspended for approximately ${remaining} more minute(s).`, true);
      return true;
    }
    return false;
  }

  function triggerViolation(reason = "Policy Violation") {
    flagCount++;
    auditLog(`VIOLATION: ${reason} (Incident ${flagCount}/2)`);
    if (flagCount < 3) {
      log(`Warning: Policy violation detected (${reason}). (${flagCount}/2 before suspension).`, true);
    } else {
      const duration = flagCount - 2;
      banUntil = Date.now() + (duration * 60000);
      log(`Messaging privileges suspended: Multiple violations. Duration: ${duration}m.`, true);
      if (conn) conn.send({ type: 'ban-alert', duration: duration });
    }
  }

  function blockMessageUI(msgId, notifySelf = false) {
    const msgElement = document.getElementById(`msg-${msgId}`);
    if (msgElement) {
      msgElement.textContent = "Content Removed";
      msgElement.classList.add('blocked');
      const btn = msgElement.parentElement.querySelector('.report-btn');
      if (btn) btn.remove();
      if (notifySelf) triggerViolation("Remote moderation trigger");
    }
  }

  function handleReport(id, text, msgDiv, btn) {
    if (typeof text !== 'string') return;
    auditLog(`REPORT: Flagged peer message ID ${id} ("${text}")`);
    if (checkFuzzy(text)) {
      blockMessageUI(id);
      if (conn) conn.send({ type: 'flag', msgId: id });
      log("Your report confirmed. Content removed for all parties.", true);
    } else {
      log(`Report recorded. Match threshold not met.`, true);
    }
  }

  function addMessage(sender, content, type, id, isFile = false) {
    const wrapper = document.createElement('div');
    wrapper.className = `msg-wrapper ${type}`;
    const msgDiv = document.createElement('div');
    msgDiv.className = 'msg';
    msgDiv.id = `msg-${id}`;
    
    const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    
    if (isFile) {
        const blob = new Blob([content.data], { type: content.type });
        const url = URL.createObjectURL(blob);
        if (content.type.startsWith('image/')) {
            msgDiv.innerHTML = `<img src="${url}" class="file-preview" onclick="window.open('${url}')">`;
        } else {
            msgDiv.innerHTML = `<a href="${url}" download="${content.name}" class="file-link">📁 ${content.name}</a>`;
        }
    } else {
        msgDiv.textContent = content;
    }

    msgDiv.innerHTML += ` <span class="msg-time">${time}<span class="read-receipt" id="receipt-${id}"> ✓</span></span>`;
    wrapper.appendChild(msgDiv);

    if (type === 'peer' && !isFile) {
      const btn = document.createElement('button');
      btn.className = 'report-btn';
      btn.innerHTML = '⚑';
      btn.onclick = () => handleReport(id, content, msgDiv, btn);
      wrapper.appendChild(btn);
    }

    messagesEl.appendChild(wrapper);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function setupConnection(connection) {
    conn = connection;
    conn.on('open', () => {
      statusText.textContent = "Online";
      statusPill.classList.add('online');
      msgInput.disabled = false; sendBtn.disabled = false;
      endChatBtn.disabled = false;
      log("Connection established!");
      auditLog(`Handshake initiated with Peer: ${conn.peer}`);
      conn.send({ type: 'handshake', name: nameInput.value, ip: myIp });
    });
    conn.on('data', (data) => {
      if (data?.type === 'handshake' || data?.type === 'name-update') {
        chatTitle.textContent = data.name;
        if(data.ip) peerIp = data.ip;
        auditLog(`Peer Update | Name: ${data.name} | PeerIP: ${peerIp}`, data.name);
      } else if (data?.type === 'audit-sync') {
        auditLog(data.action, chatTitle.textContent);
      } else if (data?.type === 'flag') {
        auditLog(`MODERATION: Remote party flagged message ID ${data.msgId}`, chatTitle.textContent);
        blockMessageUI(data.msgId, true);
      } else if (data?.type === 'ban-alert') {
        log(`Security Alert: The other party has been suspended...`, true);
      } else if (data?.type === 'chat') {
        addMessage(chatTitle.textContent, data.text, 'peer', data.id);
        auditLog(`RECEIVED MESSAGE: "${data.text}"`, chatTitle.textContent);
        conn.send({ type: 'read-receipt', msgId: data.id });
      } else if (data?.type === 'file') {
        addMessage(chatTitle.textContent, { data: data.file, name: data.name, type: data.fileType }, 'peer', data.id, true);
        auditLog(`Received File: ${data.name}`, chatTitle.textContent);
        conn.send({ type: 'read-receipt', msgId: data.id });
      } else if (data?.type === 'read-receipt') {
        const receipt = document.getElementById(`receipt-${data.msgId}`);
        if(receipt) receipt.style.display = 'inline';
      } else if (data?.type === 'presence') {
        const action = data.state === 'away' ? "left the tab" : "returned to the tab";
        log(`${chatTitle.textContent} has ${action}.`);
        auditLog(`PRESENCE: User ${action}`, chatTitle.textContent);
      } else if (data?.type === 'typing') {
        typingEl.innerText = data.isTyping ? `${chatTitle.textContent} is typing...` : "";
      }
    });
    conn.on('close', () => {
      const wasUserClosed = conn.userClosed; 
      statusText.textContent = "Offline";
      statusPill.classList.remove('online');
      msgInput.disabled = true; sendBtn.disabled = true;
      endChatBtn.disabled = true;
      auditLog(`Connection closed with ${conn.peer}`);
      if (!wasUserClosed) {
        log("The other user has ended the chat session or disconnected.", true);
      }
      conn = null;
    });
  }

  function sendMessage() {
    if (checkBanStatus()) return;
    
    // Anti-Spam (Max 5 msgs / 3s)
    const now = Date.now();
    messageHistory = messageHistory.filter(t => now - t < 3000);
    if (messageHistory.length >= 5) {
      triggerViolation("Spam flood detected");
      return;
    }

    const text = msgInput.value.trim();
    if (!text || !conn) return;

    if (typeof censor !== 'undefined' && (censor.isBlocked(text) || checkFuzzy(text))) {
      auditLog(`FILTER TRIGGERED: Blocked attempt to send "${text}"`);
      triggerViolation("Banned content filter");
      msgInput.value = '';
      return;
    }

    messageHistory.push(now);
    const msgId = Date.now() + Math.random().toString(36).substr(2, 5);
    auditLog(`SENT MESSAGE: "${text}"`);
    conn.send({ type: 'chat', text: text, id: msgId });
    addMessage('Me', text, 'me', msgId);
    msgInput.value = '';
    sendTyping(false);
  }

  // File Sharing
  attachBtn.onclick = () => fileInput.click();
  fileInput.onchange = (e) => {
    const file = e.target.files[0];
    if (!file || !conn) return;
    if (file.size > 2 * 1024 * 1024) { log("Limit: 2MB per file.", true); return; }

    const reader = new FileReader();
    reader.onload = () => {
        const msgId = Date.now() + Math.random().toString(36).substr(2, 5);
        conn.send({ type: 'file', file: reader.result, name: file.name, fileType: file.type, id: msgId });
        addMessage('Me', { data: reader.result, name: file.name, type: file.type }, 'me', msgId, true);
        auditLog(`Sent File: ${file.name}`);
    };
    reader.readAsArrayBuffer(file);
    fileInput.value = "";
  };

  // Tab Visibility Detection
  document.addEventListener('visibilitychange', () => {
    if (conn && conn.open) {
      const state = document.hidden ? 'away' : 'back';
      conn.send({ type: 'presence', state: state });
      auditLog(`Visibility status changed: ${state}`);
    }
  });

  let typingTimer;
  msgInput.addEventListener('input', () => {
    if (conn && conn.open) conn.send({ type: 'typing', isTyping: true });
    clearTimeout(typingTimer);
    typingTimer = setTimeout(() => {
        if (conn && conn.open) conn.send({ type: 'typing', isTyping: false });
    }, 2000);
  });

  peer.on('open', () => { 
    statusText.textContent = "Ready"; 
    log("Waiting for a connection..."); 
    auditLog(`Session Ready. LocalID: ${myUniqueId}`); 
  });
  peer.on('connection', (c) => { 
    if(conn) return;
    auditLog(`Incoming Connection Request from ${c.peer}`);
    setupConnection(c); 
    c.on('open', () => c.send({ type: 'handshake', name: nameInput.value, ip: myIp }));
  });

  document.getElementById('connect-btn').addEventListener('click', () => {
    const target = document.getElementById('peer-id-input').value.trim().toUpperCase();
    if (target && target !== myUniqueId) {
        auditLog(`Attempting outbound connection to ${target}`);
        const c = peer.connect(target, { reliable: true });
        setupConnection(c);
        c.on('open', () => c.send({ type: 'handshake', name: nameInput.value, ip: myIp }));
        sidebar.classList.remove('open');
    }
  });

  document.getElementById('download-btn').addEventListener('click', () => {
    const text = Array.from(messagesEl.children).map(m => m.textContent).join('\n');
    const blob = new Blob([text], { type: 'text/plain' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `audit-log-${Date.now()}.txt`;
    a.click();
    auditLog("Downloaded full chat transcript");
  });

  // History Shortcut
  window.addEventListener('keydown', (e) => {
    if (e.ctrlKey && e.altKey && e.key.toLowerCase() === 'q') {
      const overlay = document.getElementById('history-overlay');
      const isOpening = overlay.style.display !== 'flex';
      overlay.style.display = isOpening ? 'flex' : 'none';
      auditLog(isOpening ? "Opened History Log" : "Closed History Log");
    }
  });

  endChatBtn.addEventListener('click', () => {
    if (conn) {
      auditLog("Manually terminated the session");
      conn.userClosed = true; 
      log("You have ended the chat session.", true);
      conn.close();
      if (window.innerWidth <= 768) sidebar.classList.remove('open');
    }
  });

  document.getElementById('menu-btn').addEventListener('click', (e) => {
    e.stopPropagation();
    sidebar.classList.add('open');
    auditLog("Opened Sidebar Menu");
  });

  document.getElementById('close-sidebar').addEventListener('click', () => {
    sidebar.classList.remove('open');
    auditLog("Closed Sidebar Menu");
  });

  document.getElementById('copy-btn').addEventListener('click', () => {
    navigator.clipboard.writeText(myUniqueId);
    auditLog("Copied connection ID to clipboard");
    log("Code copied!");
  });

  // Admin Override logic
  const activeKeys = new Set();
  window.addEventListener('keydown', (e) => {
    activeKeys.add(e.code);
    if (e.altKey && activeKeys.has('KeyQ') && activeKeys.has('KeyW')) {
      document.getElementById('override-modal').style.display = 'flex';
      document.getElementById('override-pass').focus();
    }
  });
  window.addEventListener('keyup', (e) => activeKeys.delete(e.code));

  document.getElementById('submit-override').onclick = () => {
    if (document.getElementById('override-pass').value === 'devSaysLiftBan') {
      auditLog("ADMIN OVERRIDE: All messaging privileges restored via developer key.");
      flagCount = 0; banUntil = null;
      log("Administrative Override: All restrictions lifted. Records cleared.", false);
      document.getElementById('override-modal').style.display = 'none';
      document.getElementById('override-pass').value = '';
    } else {
      auditLog("OVERRIDE FAILED: Incorrect developer key entered.");
      document.getElementById('override-modal').style.display = 'none';
      log("Authorization Failed: Invalid key.", true);
    }
  };
  
  document.getElementById('cancel-override').onclick = () => document.getElementById('override-modal').style.display = 'none';

  sendBtn.addEventListener('click', sendMessage);
  msgInput.addEventListener('keypress', (e) => e.key === 'Enter' && sendMessage());
</script>
</body>
</html>
